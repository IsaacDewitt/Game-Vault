[package]
name = "game-vault"
version = "0.8.0"
description = "Game Vault - 轻量级游戏管理器"
authors = ["Isaac"]
edition = "2021"

[lib]
name = "game_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 框架
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# 进程监控（游戏时长追踪）
sysinfo = "0.30"

# 网络请求（封面图/元数据抓取，全异步，无需 blocking）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 时间处理
chrono = { version = "0.4", features = ["serde", "clock"] }

# UUID 生成
uuid = { version = "1", features = ["v4"] }

# URL 编码
urlencoding = "2"

# ZIP 压缩（存档备份）
zip = "0.6"

# 错误处理
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 系统目录
dirs = "5"
windows-capture = "2.0.1"
half = "2"
png = "0.17"
tauri-plugin-global-shortcut = "2"

# 封面存储：解码 BMP/GIF 之外的常见格式 → 转码 WebP + 生成缩略图
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# 封面内容指纹（covers 索引去重与删除引用计数）
sha2 = "0.10"

# 提示音播放（PlaySoundW）+ SDR 白电平查询（DisplayConfig / Monitor API）
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    # 协议启动：ShellExecuteW —— steam:// 与 com.epicgames.launcher:// 是注册在
    # HKEY_CLASSES_ROOT 下的协议处理器，只有 shell 会按注册表转发给客户端
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # 截图兜底通道：WH_KEYBOARD_LL 钩子需要 GetAsyncKeyState（查修饰键态）与 VK_* 常量
    # —— 全屏游戏在前台时注册热键收不到 WM_HOTKEY，只能靠键盘钩子（见 core/hotkey_hook.rs）
    "Win32_UI_Input_KeyboardAndMouse",
] }

